apiVersion: apps/v1
kind: Deployment
metadata:
  name: waves
  labels:
    app.kubernetes.io/name: waves
    app.kubernetes.io/component: server
spec:
  # One process owns a data directory, and a second pod could be writing to the
  # same volume while the first one still holds it, so the old pod is gone
  # before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: waves
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: waves
        app.kubernetes.io/component: server
    spec:
      # The server talks to nothing in the cluster: no API calls, so no token is
      # projected into the container.
      automountServiceAccountToken: false
      # A Service named `waves` makes Kubernetes inject docker-link variables such
      # as WAVES_PORT=tcp://<ip>:80 into every pod in the namespace, which collides
      # with the server's own WAVES_* configuration. Turn them off.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Without this the kubelet re-applies fsGroup to the whole data volume on
        # every pod start, which adds group access and the setgid bit to the store
        # directory the server created at 0700. The store refuses a directory other
        # users can reach, so every pod after the first answered 503 on /readyz.
        # With it the kubelet looks only at the volume root, finds it already in
        # the right group, and leaves what is under it alone.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          # The overlay replaces this with the image that was just pushed.
          image: waves
          imagePullPolicy: IfNotPresent
          env:
            # A subdirectory, not the mount root: a local-path volume root is owned
            # by root, while the file store refuses any data dir it does not own at
            # mode 0700. It creates this one itself, owned by uid 1000, mode 0700,
            # and fsGroupChangePolicy above keeps the kubelet from widening it.
            - name: WAVES_DATA_DIR
              value: /data/store
            - name: WAVES_PORT
              value: "8080"
            # The admin token, as a file rather than an environment variable, where
            # any co-tenant of the node could read it from /proc. The file is read
            # once at startup, so a rotated token needs a restart to take effect.
            - name: WAVES_ADMIN_TOKEN_FILE
              value: /run/secrets/waves-admin/token
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: admin
              mountPath: /run/secrets/waves-admin
              readOnly: true
          readinessProbe:
            # Readiness is the store being readable, not the process being alive:
            # a pod whose volume the store refuses answers 200 to /healthz and 500
            # to everything else, and a liveness probe must not restart it for
            # that. So liveness stays /healthz and readiness asks /readyz.
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: waves-data
        # The root filesystem is read only, so the writable scratch the runtime
        # expects is a volume of its own.
        - name: tmp
          emptyDir: {}
        # Optional: without this Secret the admin routes are disabled and answer
        # 404 exactly as an unknown path does, which is what a service that has
        # not been given one should do. Group readable and not world readable;
        # fsGroup makes the group the one the server runs as.
        - name: admin
          secret:
            secretName: waves-admin
            optional: true
            defaultMode: 0440
