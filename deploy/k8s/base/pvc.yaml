apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: waves-data
  labels:
    app.kubernetes.io/name: waves
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # No storageClassName: the cluster default StorageClass binds the volume, so
  # the manifest carries no provisioner of any particular cluster's.
